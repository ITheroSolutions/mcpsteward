name: MCP Registry

# Lists the published npm version in the official MCP Registry. Manual dispatch
# only, run after the npm release, because the registry checks that the npm
# package for this version exists and carries the matching mcpName.
#
# Authentication is GitHub OIDC: no token or secret is stored anywhere.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      MCP_PUBLISHER_VERSION: v1.8.7

    steps:
      - uses: actions/checkout@v4

      - name: Check server.json matches package.json
        run: |
          set -euo pipefail
          pkg="$(jq -r .version package.json)"
          name="$(jq -r .mcpName package.json)"
          test "$(jq -r .version server.json)" = "$pkg"
          test "$(jq -r '.packages[0].version' server.json)" = "$pkg"
          test "$(jq -r .name server.json)" = "$name"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Authenticate
        run: ./mcp-publisher login github-oidc

      - name: Publish
        run: ./mcp-publisher publish
